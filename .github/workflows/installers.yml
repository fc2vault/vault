# Builds the download installers and attaches them to the GitHub release:
#   Vault-mac-apple-silicon.dmg, Vault-mac-intel.dmg, Vault-windows-setup.exe (fixed names, so
#   https://github.com/fc2vault/vault/releases/latest/download/<name> always gets the newest)
# Runs when a release is published. By hand (Actions → Installers → Run workflow) it builds a tag
# for testing: the installers land under the run's Artifacts, not on the release page,
# unless "attach" is ticked.
name: Installers

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v1.9.0)"
        required: true
      ref:
        description: "Build from this branch or commit instead of the tag (optional)"
        required: false
        default: ""
      attach:
        description: "Attach the installers to that release (otherwise: run artifacts only)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  REF: ${{ inputs.ref || github.event.release.tag_name || inputs.tag }}
  ATTACH: ${{ github.event_name == 'release' || inputs.attach }}

jobs:
  mac:
    # model builds (tags vault-r<N>) are releases too: installers only for app versions (v1.2.3)
    if: startsWith(github.event.release.tag_name || inputs.tag, 'v') && !startsWith(github.event.release.tag_name || inputs.tag, 'vault-r')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.REF }}
          path: release
      - name: Build both disk images
        run: |
          for arch in arm64 x86_64; do
            bash release/packaging/mac/build_mac.sh release "$arch" "$RUNNER_TEMP/out" "$RUNNER_TEMP/dl"
          done
      - name: Smoke test (Apple Silicon build)
        run: |
          set -e
          dmg=$(ls "$RUNNER_TEMP"/out/*apple-silicon.dmg)
          hdiutil attach -nobrowse -mountpoint /tmp/vaultdmg "$dmg"
          R=/tmp/vaultdmg/Vault.app/Contents/Resources
          "$R/bin/ffmpeg" -hide_banner -version | head -1
          "$R/bin/ffprobe" -hide_banner -version | head -1
          mkdir -p /tmp/lib/FC2-PPV-1234567 /tmp/vdata
          "$R/bin/ffmpeg" -hide_banner -loglevel error -f lavfi -i testsrc=duration=3:size=320x240:rate=10 /tmp/lib/FC2-PPV-1234567/FC2-PPV-1234567.mp4
          cd "$R/app"
          VAULT_DATA=/tmp/vdata PATH="$R/bin:$PATH" "$R/python/bin/python3" serve.py --library /tmp/lib --port 8799 > /tmp/vdata/server.log 2>&1 &
          SRV=$!
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:8799/ && break; sleep 1; done
          curl -sf http://127.0.0.1:8799/api/data | grep -q FC2-PPV-1234567 || { cat /tmp/vdata/server.log; exit 1; }
          echo "server answers and lists the test movie"
          "$R/python/bin/python3" "$R/app/scene_tagger.py" --help > /dev/null
          echo "bundled scene tagger starts"
          "$R/python/bin/python3" -c "import sys; sys.path.insert(0, '$R/app'); import tlsgen; tlsgen.make_all('/tmp/vtls')"
          test -s /tmp/vtls/vault.crt
          echo "HTTPS certificate made"
          kill $SRV; wait $SRV || true
          cd /; hdiutil detach /tmp/vaultdmg || hdiutil detach -force /tmp/vaultdmg
      - uses: actions/upload-artifact@v7
        with:
          name: mac-installers
          path: ${{ runner.temp }}/out/*.dmg
          retention-days: 14
      - name: Attach to the release
        if: env.ATTACH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$RUNNER_TEMP"/out/*.dmg --clobber -R "$GITHUB_REPOSITORY"

  windows:
    if: startsWith(github.event.release.tag_name || inputs.tag, 'v') && !startsWith(github.event.release.tag_name || inputs.tag, 'vault-r')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.REF }}
          path: release
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build the installer
        shell: pwsh
        run: ./release/packaging/windows/build_windows.ps1 -Release release -Out "$env:RUNNER_TEMP\out"
      - name: Smoke test (silent install, start, list a movie)
        shell: pwsh
        run: |
          $setup = Get-ChildItem "$env:RUNNER_TEMP\out\Vault-windows-setup.exe" | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$env:RUNNER_TEMP\vault" -Wait
          $app = "$env:RUNNER_TEMP\vault"
          & "$app\bin\ffmpeg.exe" -hide_banner -version | Select-Object -First 1
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\lib\FC2-PPV-1234567", "$env:RUNNER_TEMP\vdata" | Out-Null
          & "$app\bin\ffmpeg.exe" -hide_banner -loglevel error -f lavfi -i testsrc=duration=3:size=320x240:rate=10 "$env:RUNNER_TEMP\lib\FC2-PPV-1234567\FC2-PPV-1234567.mp4"
          $env:VAULT_DATA = "$env:RUNNER_TEMP\vdata"
          $env:PATH = "$app\bin;$env:PATH"
          $p = Start-Process "$app\python\python.exe" -ArgumentList "serve.py", "--library", "$env:RUNNER_TEMP\lib", "--port", "8799" -WorkingDirectory "$app\app" -RedirectStandardError "$env:RUNNER_TEMP\vdata\err.log" -PassThru
          $ok = $false
          foreach ($i in 1..60) {
            try { $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8799/api/data; if ($r.Content -match "FC2-PPV-1234567") { $ok = $true; break } } catch {}
            Start-Sleep 1
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Get-Content "$env:RUNNER_TEMP\vdata\err.log"; throw "Vault did not answer" }
          "server answers and lists the test movie"
          & "$app\python\python.exe" "$app\app\scene_tagger.py" --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "bundled scene tagger does not start" }
          "bundled scene tagger starts"
          & "$app\python\python.exe" -c "import sys; sys.path.insert(0, r'$app\app'); import tlsgen; tlsgen.make_all(r'$env:RUNNER_TEMP\vtls')"
          if (-not (Test-Path "$env:RUNNER_TEMP\vtls\vault.crt")) { throw "no HTTPS certificate" }
          "HTTPS certificate made"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: ${{ runner.temp }}/out/Vault-windows-setup.exe
          retention-days: 14
      - name: Attach to the release
        if: env.ATTACH == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:TAG" (Get-ChildItem "$env:RUNNER_TEMP\out\Vault-windows-setup.exe").FullName --clobber -R "$env:GITHUB_REPOSITORY"

      - name: Self-update test (Vault downloads the newest release's setup and runs it)
        # after the attach step: during a release build the newest release is this one, and its
        # setup must already be on it
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $app = "$env:RUNNER_TEMP\vault"
          $data = "$env:LOCALAPPDATA\Vault"
          New-Item -ItemType Directory -Force $data | Out-Null
          $lib = ("$env:RUNNER_TEMP\lib") -replace '\\', '/'
          Set-Content "$data\config.json" ('{"library": "' + $lib + '", "port": 8797}')
          Start-Process "$app\python\pythonw.exe" -ArgumentList ('"' + "$app\launcher.pyw" + '"'), "--background" -WorkingDirectory $app
          $up = $false
          foreach ($i in 1..60) { try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8797/ | Out-Null; $up = $true; break } catch { Start-Sleep 1 } }
          if (-not $up) { throw "Vault did not start from the launcher" }
          $u = Invoke-RestMethod "http://127.0.0.1:8797/api/update?check=1"
          "kind=$($u.kind) current=$($u.current) latest=$($u.info.latest) asset=$($u.info.asset.name)"
          if ($u.kind -ne "windows") { throw "not detected as a Windows install" }
          $r = Invoke-RestMethod -Method Post -ContentType "application/json" -Body '{"reinstall": true}' http://127.0.0.1:8797/api/update/install
          if (-not $r.started) { throw "update did not start: $($r | ConvertTo-Json -Compress)" }
          $ok = $false
          foreach ($i in 1..180) {
            if ((Test-Path "$data\update.log") -and (Select-String -Path "$data\update.log" -Pattern "Installation process succeeded" -Quiet)) { $ok = $true; break }
            Start-Sleep 1
          }
          if (Test-Path "$data\update.log") { Get-Content "$data\update.log" -Tail 5 }
          if (-not $ok) { throw "the downloaded setup did not finish" }
          "the in-app update downloaded, verified and ran the setup"
