<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vault</title>
<style>
:root{
  --bg:#0c0d12; --bg2:#12141c; --panel:#161824; --panel2:#1c1f2e;
  --line:#262a3b; --txt:#e7e9f2; --dim:#8b90a6; --dim2:#5b6076;
  --accent:#ff3b6b; --accent2:#7b5bff; --good:#2ecc71; --warn:#f5a623;
  --scroll:#2b3044;
  --card-w:210px;
}
:root[data-theme="light"]{
  --bg:#f5f6f9; --bg2:#eceef3; --panel:#ffffff; --panel2:#f0f1f6;
  --line:#d9dce6; --txt:#191b24; --dim:#5b6076; --dim2:#9096a8;
  --accent:#e11d54; --accent2:#6b46ff; --good:#1fa85a; --warn:#b9770a;
  --scroll:#c2c6d2;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--txt);
  font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

#app{display:flex;flex-direction:column;height:100%}
/* ---- top bar ---- */
header{display:flex;align-items:center;gap:14px;padding:10px 16px;
  background:linear-gradient(180deg,#14151f,#101119);border-bottom:1px solid var(--line);
  flex:none;z-index:20}
.brand{font-weight:800;font-size:19px;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.brand .dot{width:11px;height:11px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,var(--accent),#a01840);
  box-shadow:0 0 12px var(--accent)}
.brand small{color:var(--dim);font-weight:500;font-size:11px;letter-spacing:0}
.search{flex:1;max-width:520px;position:relative}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:9px 12px 9px 34px;color:var(--txt);outline:none;font-size:14px}
.search input:focus{border-color:var(--accent2)}
.search svg{position:absolute;left:10px;top:9px;width:16px;height:16px;fill:var(--dim)}
.stat{color:var(--dim);font-size:12px;white-space:nowrap}
.stat b{color:var(--txt)}
.top-actions{display:flex;gap:8px;margin-left:auto;align-items:center}
select,.btn{background:var(--panel);border:1px solid var(--line);border-radius:9px;
  padding:8px 11px;color:var(--txt);font-size:13px}
select:focus{outline:none;border-color:var(--accent2)}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{padding:8px 12px;color:var(--dim);font-size:13px}
.seg button.on{background:var(--accent);color:#fff}

/* ---- body ---- */
.body{display:flex;flex:1;min-height:0}
aside{width:250px;flex:none;background:var(--bg2);border-right:1px solid var(--line);
  overflow-y:auto;padding:14px 12px 40px}
aside h4{margin:16px 6px 8px;font-size:11px;text-transform:uppercase;letter-spacing:1px;
  color:var(--dim2)}
aside h4:first-child{margin-top:2px}
.frow{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:7px;
  cursor:pointer;color:var(--dim);font-size:13px}
.frow:hover{background:var(--panel)}
.frow.on{background:var(--panel2);color:var(--txt)}
.frow .c{margin-left:auto;color:var(--dim2);font-size:11px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:2px 4px}
.tagbox{max-height:230px;overflow-y:auto;padding:4px;border:1px solid var(--line);border-radius:8px;background:var(--bg2)}
.chip{padding:4px 9px;border:1px solid var(--line);border-radius:20px;font-size:12px;
  color:var(--dim);cursor:pointer;user-select:none}
.chip:hover{border-color:var(--accent2);color:var(--txt)}
.chip.on{background:var(--accent2);border-color:var(--accent2);color:#fff}
.side-input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:7px 10px;color:var(--txt);font-size:13px;outline:none}
.side-input:focus{border-color:var(--accent2)}
.side-clear{font-size:11px;color:var(--dim2);cursor:pointer;margin:4px 6px 0}
.side-clear:hover{color:var(--accent)}
.range{padding:4px 6px}
.range label{display:flex;justify-content:space-between;color:var(--dim);font-size:12px;margin-bottom:4px}
input[type=range]{width:100%;accent-color:var(--accent)}

main{flex:1;overflow-y:auto;padding:16px 18px 60px;position:relative}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--card-w),1fr));gap:16px}
.sentinel{grid-column:1/-1;padding:18px;text-align:center;color:var(--dim);font-size:13px}
.group-h{grid-column:1/-1;display:flex;align-items:center;gap:12px;margin:18px 2px 2px;
  padding-bottom:8px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
.group-h:hover{border-color:var(--accent2)}
.group-h .gcar{color:var(--dim);font-size:24px;line-height:1;width:26px;flex:none;text-align:center;
  align-self:center;cursor:pointer;transition:transform .12s}
.group-h .gcar:hover{color:var(--accent2)}
.group-h.collapsed{border-bottom-style:dashed}
.group-h.collapsed .gcar{transform:rotate(-90deg)}
.group-h .pf{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--panel2);
  border:1px solid var(--line)}
.group-h .nm{font-weight:700;font-size:16px}
.group-h .sub{color:var(--dim);font-size:12px}
.group-h .pf,.group-h .nm{cursor:pointer}
.group-h .pf:hover{box-shadow:0 0 0 2px var(--accent2)}
.group-h .nm:hover{color:var(--accent2)}
/* actress overview modal */
.abox{width:min(1000px,96vw);max-height:92vh;display:flex;flex-direction:column}
.ahead{display:flex;gap:16px;align-items:flex-start;flex:none}
.ahead .apf{width:104px;height:104px;border-radius:12px;object-fit:cover;background:var(--panel2);flex:none}
.ahead .apf.blank{display:flex;align-items:center;justify-content:center;color:var(--dim2);font-size:34px}
.ahead .anm{font-size:22px;font-weight:800;line-height:1.15}
.ahead .ajp{color:var(--dim);font-size:14px;margin-top:3px}
.ahead .astat{color:var(--txt);font-size:13px;margin-top:8px}
.ahead .aalias{color:var(--dim2);font-size:12px;margin-top:4px}
.ahead .adesc{color:var(--dim);font-size:13px;font-style:italic;margin-top:8px;line-height:1.5;max-width:760px}
.aclose{margin-left:8px;font-size:26px;color:var(--dim);line-height:1;cursor:pointer;flex:none;align-self:flex-start}
.aclose:hover{color:var(--txt)}
.ahead{display:flex;gap:14px;align-items:flex-start}
.ahead>div{flex:1 1 auto}
.ahead .nedit{margin-left:auto;font-size:15px;color:var(--dim);line-height:1;cursor:pointer;border:1px solid var(--line);border-radius:7px;padding:4px 7px;flex:none;align-self:flex-start}
.ahead .nedit:hover{color:var(--accent2);border-color:var(--accent2)}
.abody{overflow-y:auto;flex:1;min-height:0;margin-top:4px}
.asec{margin:14px 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--dim2)}
.asec:first-child{margin-top:6px}
.asec .warnc{color:var(--warn)}
.amovies{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;
  cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s;position:relative}
.card:hover{transform:translateY(-4px);border-color:var(--accent2);
  box-shadow:0 12px 30px rgba(0,0,0,.5)}
.thumb{position:relative;aspect-ratio:16/9;background:#0a0b10 center/cover no-repeat;
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ph{color:var(--dim2);font-size:12px}
.badges{position:absolute;top:7px;left:7px;right:7px;display:flex;gap:5px;flex-wrap:wrap;
  justify-content:flex-end;pointer-events:none}
.bdg{background:rgba(0,0,0,.72);backdrop-filter:blur(3px);border-radius:6px;padding:2px 6px;
  font-size:11px;font-weight:600;color:#fff}
.bdg.hd{color:#0c0d12;background:var(--warn)}
.bdg.parts{background:var(--accent2)}
.bdg.cens{background:#e11d48;color:#fff;font-weight:700;letter-spacing:.3px}
.play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;
  transition:opacity .12s;background:rgba(0,0,0,.25)}
.card:hover .play{opacity:1}
.play svg{width:52px;height:52px;fill:#fff;filter:drop-shadow(0 2px 8px rgba(0,0,0,.6))}
.meta{padding:9px 10px 10px}
.meta .a{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .a.unk{color:var(--dim2);font-weight:500;font-style:italic}
.meta .c{color:var(--dim);font-size:11px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .ctitle{color:var(--dim);font-size:11px;line-height:1.35;margin-top:5px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.meta .tags span{font-size:10px;color:var(--dim);background:var(--panel2);border-radius:4px;padding:1px 5px}
.fav{position:absolute;top:6px;right:6px;z-index:5;width:30px;height:30px;border-radius:50%;
  background:rgba(0,0,0,.55);backdrop-filter:blur(3px);color:#fff;font-size:16px;line-height:30px;
  opacity:0;transition:opacity .12s,color .12s,transform .1s}
.card:hover .fav{opacity:1}
.fav:hover{transform:scale(1.15)}
.fav.on{opacity:1;color:var(--accent)}
.mark{position:absolute;top:6px;left:6px;z-index:5;width:30px;height:30px;border-radius:50%;
  background:rgba(0,0,0,.55);backdrop-filter:blur(3px);color:#fff;font-size:15px;line-height:30px;
  font-weight:700;opacity:0;transition:opacity .12s,color .12s,transform .1s}
.card:hover .mark{opacity:1}
.mark:hover{transform:scale(1.15)}
.mark.on{opacity:1;color:var(--good);background:rgba(46,204,113,.22)}
.mini{position:absolute;bottom:9px;right:9px;display:flex;gap:5px}
.pill{font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.pill.miss{color:var(--warn);border-color:var(--warn)}
.pill.rated{color:#ffc400;border-color:#7a5f00;letter-spacing:1px}
.pill.dup{color:var(--accent2);border-color:var(--accent2)}
.orgbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(900px,96vw);
  max-height:90vh;display:flex;flex-direction:column;padding:20px 22px}
.setbox{width:min(760px,96vw)}
.settabs{display:flex;gap:6px;margin:12px 0 14px;flex:none;flex-wrap:wrap}
.settab{padding:7px 14px;border:1px solid var(--line);border-radius:9px;color:var(--dim);
  font-size:13px;cursor:pointer;background:var(--bg2)}
.settab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.setpane{flex:1;overflow-y:auto;min-height:200px}
.setsearch{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:8px;
  color:var(--txt);padding:8px 10px;font-size:13px;margin-bottom:10px;box-sizing:border-box}
.setrow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid var(--line);font-size:13px}
.setrow:hover{background:var(--bg2)}
.setrow .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.setrow .cnt{color:var(--dim2);font-size:12px;flex:none}
.setin{background:var(--panel);border:1px solid var(--line);border-radius:7px;color:var(--txt);
  padding:5px 8px;font-size:13px;min-width:0}
.setin:focus{outline:none;border-color:var(--accent2)}
.setbtn{padding:4px 10px;border:1px solid var(--line);border-radius:7px;color:var(--dim);
  font-size:12px;cursor:pointer;background:var(--bg2);flex:none}
.setbtn:hover{color:var(--accent2);border-color:var(--accent2)}
.setbtn.danger:hover{color:var(--accent);border-color:var(--accent)}
.setsec{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--dim2);margin:14px 0 8px}
.setnote{color:var(--dim);font-size:12px;line-height:1.5;margin:4px 0 10px}
.orghd{font-size:19px;font-weight:800;flex:none}
.orgsub{color:var(--dim);font-size:13px;margin:8px 0 12px;line-height:1.5;flex:none}
.pactions{flex:none}
.enbanner{border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.5;margin:12px 0}
.enbanner.ok{background:rgba(52,199,120,.12);border:1px solid rgba(52,199,120,.4);color:#7ee2a8}
.enbanner.warn{background:rgba(240,170,40,.12);border:1px solid rgba(240,170,40,.45);color:#f2c069}
.engrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.enr{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:3px 0;border-bottom:1px solid var(--line)}
.enk{color:var(--dim)}.env{font-weight:700;text-align:right}
@media(max-width:520px){.engrid{grid-template-columns:1fr}}
.orglist{flex:1;overflow-y:auto;border:1px solid var(--line);border-radius:10px;background:var(--bg2);padding:6px}
.oggrp{border:1px solid var(--line);border-radius:9px;margin:6px 2px;background:var(--panel);overflow:hidden}
.oghdr{display:flex;align-items:center;gap:10px;padding:7px 10px;background:var(--bg2);border-bottom:1px solid var(--line)}
.ogcode{font-family:ui-monospace,Menlo,monospace;font-weight:800;font-size:12px}
.ogcode.dim{color:var(--dim2);font-weight:600}
.oghint{color:var(--dim);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ogrows{padding:2px 6px}
.orgrow input.ogchk{flex:none;margin:0 2px 0 0;cursor:pointer}
.orgrow{cursor:default}
.ogenrich{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:6px 8px;align-items:center;padding:8px 10px;border-top:1px solid var(--line);background:var(--bg2)}
.ogel{color:var(--dim);font-size:12px}
.ogin{background:var(--panel);border:1px solid var(--line);border-radius:7px;color:var(--txt);padding:5px 8px;font-size:12px;min-width:0}
.ogin:focus{outline:none;border-color:var(--accent2)}
.scbar{height:8px;background:var(--bg2);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:10px 0}
.scbarfill{height:100%;width:0;background:var(--accent);transition:width .3s ease}
.scwho{margin-left:auto;color:var(--dim);font-size:12px;white-space:nowrap;padding-left:10px}
.of.dim2{color:var(--dim2)}
@media(max-width:560px){.ogenrich{grid-template-columns:auto 1fr}}
.orgrow{display:flex;align-items:center;gap:8px;padding:4px 6px;font-size:12px;border-bottom:1px solid var(--line)}
.orgrow:last-child{border-bottom:none}
.ot{flex:none;width:74px;text-transform:uppercase;font-size:10px;font-weight:700;letter-spacing:.5px;
  padding:2px 6px;border-radius:5px;text-align:center;color:#fff}
.ot.folder{background:var(--accent2)} .ot.file{background:#3a7} .ot.junk{background:var(--dim2)} .ot.duplicate{background:var(--warn);color:#111}
.of{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;direction:rtl;text-align:left}
.oarrow{color:var(--dim2);flex:none} .oto{color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.stars{display:inline-flex;align-items:center;gap:3px;font-size:22px;line-height:1}
.stars .star{color:#3a3f52;cursor:pointer;transition:color .1s,transform .1s}
.stars .star:hover{transform:scale(1.15)}
.stars .star.on{color:#ffc400}
.stars .star.clr{font-size:13px;color:var(--dim2);margin-left:6px}
.stars .star.clr:hover{color:var(--accent)}
.col-rating .stars{font-size:14px}
.card.ghost{border-style:dashed;background:#101017;opacity:.72;transition:opacity .12s,border-color .12s}
.card.ghost:hover{opacity:1;transform:translateY(-3px);border-color:var(--warn)}
.gthumb{aspect-ratio:16/9;background:repeating-linear-gradient(45deg,#141620,#141620 10px,#171a26 10px,#171a26 20px);
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;overflow:hidden}
.gcover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gwant{position:absolute;top:6px;left:6px;z-index:2;font-size:10px;font-weight:700;letter-spacing:.5px;
  color:var(--warn);background:rgba(0,0,0,.62);padding:2px 6px;border-radius:5px}
.gcode{position:relative;font-size:11px;color:var(--dim2);font-family:ui-monospace,monospace}

.empty{grid-column:1/-1;text-align:center;color:var(--dim);padding:80px 20px}
/* list view */
.listwrap{display:block}
table.ltab{width:100%;border-collapse:collapse;font-size:13px}
table.ltab th{position:sticky;top:0;background:var(--bg2);text-align:left;padding:9px 10px;color:var(--dim2);
  font-size:11px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--line);z-index:2;white-space:nowrap}
table.ltab td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.lrow{cursor:pointer}
.lrow:hover{background:var(--panel)}
.lrow.lmiss{opacity:.62}.lrow.lmiss:hover{opacity:1}
.lrow .col-poster{width:76px;padding:4px 8px}
.lrow .col-poster img,.lrow .col-poster .gimg{width:68px;height:40px;object-fit:cover;border-radius:4px;background:#0a0b10;display:block}
.lrow .col-poster .gimg{display:flex;align-items:center;justify-content:center;color:var(--warn);border:1px dashed var(--line)}
.col-code{font-family:ui-monospace,monospace;color:var(--dim);white-space:nowrap}
.col-actress{font-weight:600}
.col-tags{color:var(--dim);font-size:11px;max-width:260px}
.col-status .mtag{color:var(--warn)}
#colmenu{display:none;position:absolute;right:0;top:38px;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;padding:8px;z-index:40;box-shadow:0 12px 30px rgba(0,0,0,.5);min-width:150px}
#colmenu.on{display:block}
#colmenu label{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:6px;font-size:13px;color:var(--dim);cursor:pointer}
#colmenu label:hover{background:var(--panel)}
.sentinel{grid-column:1/-1;height:1px}

/* ---- modal player ---- */
.modal{position:fixed;inset:0;background:rgba(4,5,9,.86);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;z-index:50;padding:24px}
.modal.on{display:flex}
.player{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;
  width:min(1560px,98vw);height:min(880px,94vh);display:flex}
.p-related{width:196px;flex:none;background:var(--bg2);border-right:1px solid var(--line);
  overflow-y:auto;padding:10px 8px}
.p-related h5{margin:4px 4px 8px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--dim2)}
.rel{display:flex;gap:8px;padding:6px;border-radius:8px;cursor:pointer;margin-bottom:2px}
.rel:hover{background:var(--panel)}
.rel.cur{background:var(--panel2);box-shadow:inset 0 0 0 1px var(--accent2)}
.rel .relimg{width:66px;height:40px;object-fit:cover;border-radius:5px;flex:none;background:#0a0b10}
.rel .gimg{display:flex;align-items:center;justify-content:center;color:var(--warn);font-size:15px;
  border:1px dashed var(--line)}
.rel.grel{opacity:.6}
.rel.grel:hover{opacity:1}
.p-missing{background:repeating-linear-gradient(45deg,#0e1017,#0e1017 12px,#12141d 12px,#12141d 24px);position:relative}
.pm-cover{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:.5}
.pm-box{text-align:center;color:var(--dim);position:relative;z-index:2;background:rgba(6,7,11,.55);padding:22px 28px;border-radius:14px}
.pm-ico{font-size:44px;color:var(--warn);margin-bottom:8px}
.pm-t{font-size:18px;font-weight:700;color:var(--txt)}
.pm-s{font-size:13px;margin-top:4px}
.pm-code{font-family:ui-monospace,monospace;font-size:12px;color:var(--dim2);margin-top:10px}
.rel .rt{min-width:0;flex:1}
.rel .rc{font-size:11px;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rel .rd{font-size:10px;color:var(--dim2);margin-top:3px;display:flex;gap:6px}
.parts{margin-bottom:6px}

/* ================= touch + small screens =================
   Kept as overrides at the end of the sheet so the desktop rules above are
   untouched. Nothing here is behind UA sniffing — it keys off viewport width
   and pointer capability, so a resized desktop window gets it too. */

/* Coarse pointers can't hover, so the card controls would never appear. */
@media (hover:none){
  .card .fav,.card .mark{opacity:.92}
  /* the play overlay is a full-thumb scrim — on touch it just dims every poster,
     and tapping the card already opens the player */
  .card .play{opacity:0}
  .card:hover{transform:none;box-shadow:none}
  /* badges live top-right by default, exactly where the ♥ button now sits */
  .badges{top:auto;bottom:7px;justify-content:flex-start}
}

/* Off-canvas filter drawer. */
#drawerBtn{display:none}
.scrim{display:none}
/* player tab bar + overlay close: mobile only, switched on in the query below */
.ptabs{display:none}
.pclose-m{display:none}
.player{position:relative}
@media (max-width:820px){
  header{flex-wrap:wrap;gap:8px;padding:8px 10px}
  .brand{font-size:16px}
  .brand small{display:none}
  .search{order:3;flex:1 0 100%;max-width:none}
  .stat{order:2;font-size:11px}
  .top-actions{margin-left:auto;gap:6px;max-width:100%;overflow-x:auto;
    -webkit-overflow-scrolling:touch;scrollbar-width:none}
  .top-actions::-webkit-scrollbar{display:none}
  /* keep the action row one line tall — wrapped labels doubled the header height */
  .top-actions .btn,.top-actions select,.seg button{white-space:nowrap;
    padding:7px 10px;font-size:13px}
  #drawerBtn{padding:7px 10px;font-size:13px}
  #drawerBtn{display:inline-flex;align-items:center;gap:6px}

  /* sidebar becomes a slide-over sheet instead of eating half the width */
  aside{position:fixed;top:0;left:0;bottom:0;width:82vw;max-width:330px;z-index:60;
    transform:translateX(-100%);transition:transform .22s ease;
    box-shadow:0 0 40px rgba(0,0,0,.6);padding-bottom:80px}
  aside.on{transform:translateX(0)}
  .scrim{display:block;position:fixed;inset:0;background:rgba(4,5,9,.6);z-index:55;
    opacity:0;pointer-events:none;transition:opacity .22s}
  .scrim.on{opacity:1;pointer-events:auto}

  :root{--card-w:150px}
  .grid{gap:10px}
  #main{padding:10px}
  /* thumb-size tap targets */
  .fav,.mark{width:36px;height:36px;line-height:36px;font-size:17px}
  .group-h{margin:12px 2px 2px}
  .group-h .desc{display:none}
  /* modals go full-bleed rather than a floating box */
  .abox{width:100vw!important;max-width:100vw!important;max-height:100vh!important;
    border-radius:0!important}

  /* ---- player: video on top, everything else in a tabbed sheet below ----
     The desktop player is three columns (related 196px + stage + side 344px); that's
     540px of chrome on a 375px screen. Here it becomes a vertical stack: the video
     pins to the top and the two side panels become tabs sharing the space under it. */
  .modal{padding:0}
  .player{flex-direction:column;width:100vw;max-width:100vw;
    height:100vh;height:100dvh;           /* dvh so the iOS URL bar doesn't clip it */
    border-radius:0;border:none}
  /* DOM order is related → stage → side; flex order puts the video first */
  .p-stage{flex:none;width:100%;aspect-ratio:16/9;max-height:40vh;order:0}
  .ptabs{order:1}
  .p-related,.p-side{order:2}
  .p-stage video{width:100%;height:100%;max-height:none}
  .p-missing{aspect-ratio:16/9;max-height:40vh}
  .pm-box{padding:14px 18px}
  .pm-ico{font-size:32px}

  .ptabs{display:flex;flex:none;background:var(--bg2);border-bottom:1px solid var(--line)}
  .ptabs button{flex:1;padding:11px 8px;font-size:13px;font-weight:600;color:var(--dim);
    border-bottom:2px solid transparent}
  .ptabs button.on{color:var(--txt);border-bottom-color:var(--accent)}
  .ptabs .tcount{color:var(--dim2);font-weight:500}

  /* both panels become the full-width scrolling body; the tab picks which one shows */
  .p-related,.p-side{width:auto;flex:1;min-height:0;overflow-y:auto;
    border-right:none;padding:12px 14px 34px}
  .player[data-tab="info"] .p-related{display:none}
  .player[data-tab="list"] .p-side{display:none}
  .p-side .row1 .close{display:none}      /* replaced by the overlay button on the video */
  .p-side h2{font-size:17px}

  /* close button floating over the video */
  .pclose-m{display:flex;align-items:center;justify-content:center;
    position:absolute;top:8px;right:8px;z-index:6;width:38px;height:38px;border-radius:50%;
    background:rgba(0,0,0,.6);backdrop-filter:blur(4px);color:#fff;font-size:24px;line-height:1}

  /* roomier tap targets in the list */
  .rel{padding:9px 6px}
  .rel .relimg{width:80px;height:48px}
  .prt{padding:10px 6px}
}
@media (max-width:430px){
  :root{--card-w:132px}
  .grid{gap:8px}
  .card .ctitle{display:none}      /* long JP/EN titles dominate a 132px card */
  .stat{display:none}
}

<script>try{var _t=localStorage.getItem("vault_theme");if(_t)document.documentElement.dataset.theme=_t;}catch(e){}</script>

      <input id="q" placeholder="Search actress, code, tag, title…  ( / )" autocomplete="off">
    </div>
    <div class="top-actions">

      <button class="btn" id="importbtn" title="Import from your download folder: rename, clean, then move into the library — replacing older copies with better ones (preview first)">📥 Import</button>
      <button class="btn" id="themebtn" title="Toggle light / dark">🌙</button>

<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const fmtSize=b=>{if(!b)return"";const u=["B","KB","MB","GB","TB"];let i=0,n=b;while(n>=1024&&i<4){n/=1024;i++}return n.toFixed(n<10&&i>1?1:0)+u[i];};
const fmtDur=s=>{if(!s)return"";const h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=Math.floor(s%60);return h?`${h}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`:`${m}:${String(ss).padStart(2,'0')}`;};
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function sukebei(code){const num=(String(code).match(/(\d{5,})/)||[])[1]||code;
  const url="https://sukebei.nyaa.si/?f=0&c=0_0&q="+encodeURIComponent(num);
  // ctrl/cmd-click a temp link so the browser opens it in a BACKGROUND tab (keeps focus here)
  const a=document.createElement("a");a.href=url;a.target="_blank";a.rel="noopener";
  document.body.appendChild(a);
  const mac=/mac|iphone|ipad/i.test(navigator.platform||navigator.userAgent);
  a.dispatchEvent(new MouseEvent("click",{bubbles:true,cancelable:true,view:window,
    ctrlKey:!mac,metaKey:mac}));
  a.remove();}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),1800);}
function loadbar(p){const l=$("#load");l.style.transform=`scaleX(${p})`;if(p>=1)setTimeout(()=>l.style.transform="scaleX(0)",300);}

let DATA={items:[],actresses:[],facets:{}};
let META={};                       // code -> {duration,width,height}
let ACTBYID={},ACTBYNAME={};
let BYCODE=new Map();   // code -> item (avoids O(n) DATA.items.find on hot paths)
// can THIS browser decode HEVC/H.265? (Safari yes; Chrome-on-macOS via hardware; else no)
const HEVC_OK=(()=>{const v=document.createElement("video");
  return !!(v.canPlayType('video/mp4; codecs="hvc1.1.6.L93.B0"')||v.canPlayType('video/mp4; codecs="hev1"'));})();
const isHevc=it=>/hevc|hvc1|hev1/i.test(it&&it.vcodec||"");
function actressOf(it){return (it.actress_id&&ACTBYID[it.actress_id])||ACTBYNAME[(it.actress||"").toLowerCase()]||null;}
// lowercased search haystack, cached on the item; cleared when a searchable field is edited
function buildHay(it){return ((it.actress||"")+" "+(it.actress_jp||"")+" "+(it.aka||"")+" "+(it.actresses||[]).map(a=>a.disp).join(" ")+" "+it.code+" "+(it.title||"")+" "+(it.title_en||"")+" "+(it.tags||[]).join(" ")).toLowerCase();}
// per-browser persistence (favorites + watched)
function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||"[]")}catch(e){return[]}}
function lsGetObj(k){try{return JSON.parse(localStorage.getItem(k)||"{}")||{}}catch(e){return{}}}
const STORE={fav:new Set(lsGet("vault_fav")),seen:new Set(lsGet("vault_seen")),rating:lsGetObj("vault_rating")};
function saveStore(){try{localStorage.setItem("vault_fav",JSON.stringify([...STORE.fav]));
  localStorage.setItem("vault_seen",JSON.stringify([...STORE.seen]));
  localStorage.setItem("vault_rating",JSON.stringify(STORE.rating));}catch(e){}}
function starsHTML(code){const r=STORE.rating[code]||0;
  return `<span class="stars" data-code="${esc(code)}">${[1,2,3,4,5].map(n=>`<span class="star${n<=r?' on':''}" data-n="${n}">★</span>`).join("")}${r?`<span class="star clr" data-n="0" title="clear">✕</span>`:""}</span>`;}
function bindStars(root){(root||document).querySelectorAll(".stars .star").forEach(st=>st.onclick=e=>{
  e.stopPropagation();const w=st.closest(".stars"),code=w.dataset.code,n=+st.dataset.n,cur=STORE.rating[code]||0;
  const nn=(n===0||cur===n)?0:n;
  if(nn)STORE.rating[code]=nn;else delete STORE.rating[code];
  saveStore();refreshStars(code);if(F.sort==="rating")render();});}
function refreshStars(code){document.querySelectorAll(`.stars[data-code="${cssEsc(code)}"]`).forEach(w=>{
  const r=STORE.rating[code]||0;w.innerHTML=starsHTMLInner(code);});
  // rebind after innerHTML swap
  document.querySelectorAll(`.stars[data-code="${cssEsc(code)}"]`).forEach(w=>bindStars(w.parentElement));}
function starsHTMLInner(code){const r=STORE.rating[code]||0;
  return `${[1,2,3,4,5].map(n=>`<span class="star${n<=r?' on':''}" data-n="${n}">★</span>`).join("")}${r?`<span class="star clr" data-n="0" title="clear">✕</span>`:""}`;}
function toggleFav(code,btn){
  const now=!STORE.fav.has(code);
  if(now)STORE.fav.add(code);else STORE.fav.delete(code);
  saveStore();
  $$(`.card[data-code="${cssEsc(code)}"] .fav`).forEach(b=>b.classList.toggle('on',now));
  if(btn)btn.classList.toggle('on',now);
  const fc=$("#favc");if(fc)fc.textContent=STORE.fav.size;
  const pf=$("#pfav");if(pf)pf.classList.toggle('on',now);
  if(F.favonly&&!now)render();
}
/* ---- body measurements: stored in the DB as centimetres (canonical, integer),
   converted to imperial only at DISPLAY time via a per-browser preference ---- */
let UNITS=(()=>{try{return localStorage.getItem("vault_units")||"metric"}catch(e){return "metric"}})();
function setUnits(u){UNITS=u;try{localStorage.setItem("vault_units",u)}catch(e){}}
function fmtHeight(cm){if(!cm)return"";
  if(UNITS==="imperial"){const t=Math.round(cm/2.54),f=Math.floor(t/12);return `${f}'${t-f*12}"`;}

// Token-aware autocomplete for the comma-separated Tags field in the Organize modal.
// Native <datalist> matches the whole field value, so we rebuild #tagList options as

function tagTokenAC(inp){

function pollScanProgress(){
  clearTimeout(scanPollTimer);
  fetch("/api/scanprogress").then(r=>r.json()).then(p=>{
    const b=$("#scanlibbtn"),open=$("#scanmodal").classList.contains("on");
    if(p.running){
      b.textContent=p.total?`⟳ ${p.done}/${p.total} (${p.hits}✓)`:`⟳ ${p.code||'working…'}`;b.disabled=true;
      const st=$("#scStat"),fill=$("#scFill"),now=$("#scNow");
      if(st&&p.total){st.textContent=`${p.done} / ${p.total} · ${p.hits} updated`;fill.style.width=(100*p.done/p.total)+"%";now.textContent=p.code||"";}
      else if(st){st.textContent=p.code||"working…";}
      scanPollTimer=setTimeout(pollScanProgress,1200);
    }else{
      b.disabled=false;b.textContent="⟳ Scan library";
      const st=$("#scStat");
      if(st){st.textContent=`Done — ${p.hits||0} updated.`;const f=$("#scFill");if(f)f.style.width="100%";
        const pa=$("#scanbox").querySelector(".pactions");if(pa)pa.innerHTML='<button class="btn pri" id="scDone">Close</button>';

    }
  }).catch(()=>{});
}

    DATA.actresses.forEach(a=>{if(a.id)ACTBYID[a.id]=a;if(a.name_en)ACTBYNAME[a.name_en.toLowerCase()]=a;});

function resetFilters(){

  F.ageMin=0;F.ageMax=99;F.durMin=0;F.durMax=999;F.hd=false;F.parts=false;F.watch="all";F.favonly=false;F.censOnly=false;

/* ---------------- filtering ---------------- */
function filtered(){
  const q=F.q.toLowerCase().trim();
  return DATA.items.filter(it=>{
    if(!F.showMissing&&it.missing)return false;   // global wishlist toggle
    if(F.censOnly&&it.uncensored!==false)return false;   // censored-only
    if(F.ident==="yes"&&!it.identified)return false;
    if(F.ident==="no"&&it.identified)return false;
    if(F.actress&&F.actress!=="all"){const a=F.actress.toLowerCase();
      const cast=(it.actresses||[]).map(x=>(x.disp||"").toLowerCase());
      if((it.actress||"").toLowerCase()!==a && (it.actress_jp||"").toLowerCase()!==a
         && !(it.actress||"").toLowerCase().includes(a)
         && !(it.aka||"").toLowerCase().includes(a)
         && !cast.some(n=>n===a||n.includes(a)))return false;}
    if(F.studio&&it.producer!==F.studio)return false;
    if(F.favonly&&!STORE.fav.has(it.code))return false;
    if(F.watch==="un"&&STORE.seen.has(it.code))return false;
    if(F.watch==="seen"&&!STORE.seen.has(it.code))return false;
    if(F.fmt!=="all"&&it.ext!==F.fmt)return false;
    if(F.cups.size&&!F.cups.has(it.cup))return false;
    if(F.parts&&it.nparts<2)return false;
    if(F.res.size){const b=resBucket(it.h);if(!F.res.has(b))return false;}
    if(F.durMin>0||F.durMax<999){const d=(it.dur||0)/60;if(!it.dur)return false;if(d<F.durMin||d>F.durMax)return false;}
    if(F.hd){if(!it.h||it.h<720)return false;}
    if(F.ageMin>0&&(!it.age||it.age<F.ageMin))return false;
    if(F.ageMax<99&&(!it.age||it.age>F.ageMax))return false;
    if(F.tags.size){const t=new Set(it.tags||[]);for(const x of F.tags)if(!t.has(x))return false;}
    if(q){
      const hay=it._hay||(it._hay=buildHay(it));   // precompute once, not per keystroke
      if(!hay.includes(q))return false;
    }
    return true;
  });
}
function sortItems(arr){
  const s=F.sort;
  const dur=c=>(META[c]&&META[c].duration)||0;
  const cmp={
    mtime:(a,b)=>((b.added||b.mtime)-(a.added||a.mtime))||(b.mtime-a.mtime),
    release:(a,b)=>(b.release||"").localeCompare(a.release||""),
    size:(a,b)=>b.size-a.size,
    dur:(a,b)=>dur(b.code)-dur(a.code),
    rating:(a,b)=>((STORE.rating[b.code]||0)-(STORE.rating[a.code]||0))||b.mtime-a.mtime,
    fav:(a,b)=>(b.fav||0)-(a.fav||0),
    actress:(a,b)=>(a.actress||"~").toLowerCase().localeCompare((b.actress||"~").toLowerCase()),
    code:(a,b)=>a.code.localeCompare(b.code),
    shuffle:(a,b)=>a._rnd-b._rnd,
  }[s];
  return arr.sort(cmp);
}

/* ---------------- render ---------------- */
let io=null;      // thumb observer
/* ---------- progressive rendering ----------
   The grid used to build a DOM node for every item at once. At 4000+ movies that is
   ~80k nodes plus an IntersectionObserver per thumb, which iOS Safari kills the tab
   over. Instead each view hands startChunks() a list of jobs; one job runs now and
   the rest run as a sentinel at the end of the grid scrolls into view. */
const CHUNK=120;
let CHUNKQ=[], chunkIO=null, chunkSentinel=null;
function resetChunks(){
  CHUNKQ=[];
  if(chunkIO){chunkIO.disconnect();chunkIO=null;}
  if(chunkSentinel){chunkSentinel.remove();chunkSentinel=null;}
}
function startChunks(grid,jobs){
  CHUNKQ=jobs;
  chunkSentinel=document.createElement("div");
  chunkSentinel.className="sentinel";
  chunkSentinel.textContent="loading more…";
  // Run jobs until we've appended a batch worth of cards. Jobs report how many they
  // added, so cheap jobs (an actress group header) don't count as a whole batch —
  // otherwise the by-actress view would trickle in one header per scroll.
  const pump=()=>{
    let cards=0,steps=0;
    while(CHUNKQ.length&&cards<CHUNK&&steps<40){cards+=(CHUNKQ.shift()()||0);steps++;}
    if(F.view!=="list")wireThumbs();
    paintSel();
    if(!CHUNKQ.length){
      if(chunkIO){chunkIO.disconnect();chunkIO=null;}
      if(chunkSentinel){chunkSentinel.remove();chunkSentinel=null;}
      return;
    }
    // re-observe so the callback fires again while the sentinel is still on screen
    if(chunkSentinel&&chunkIO){
      chunkIO.unobserve(chunkSentinel);
      grid.appendChild(chunkSentinel);
      chunkIO.observe(chunkSentinel);
    }
  };
  chunkIO=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting)pump();});},
                                   {root:$("#main"),rootMargin:"800px"});
  pump();
}
function gridJobs(items,grid){
  const jobs=[];
  for(let i=0;i<items.length;i+=CHUNK){
    const slice=items.slice(i,i+CHUNK);
    jobs.push(()=>{const f=document.createDocumentFragment();
                   slice.forEach(it=>f.appendChild(card(it)));
                   grid.appendChild(f);return slice.length;});
  }
  return jobs;
}
function render(){
  let items=sortItems(filtered());
  // when searching, surface items whose ACTRESS matches the query above incidental
  // title/code substring hits — so "search a name + show missing" clusters her owned
  // AND wishlist together at the top, the way filtering by actress does.
  if(F.q){const q=F.q.toLowerCase().trim();
    const hit=it=>((it.actress||"")+" "+(it.actress_jp||"")+" "+(it.aka||"")).toLowerCase().includes(q);
    items=[...items.filter(hit),...items.filter(it=>!hit(it))];}
  const nMiss=items.filter(i=>i.missing).length;
  SELORDER=items.map(i=>i.code);                 // display order for shift-range selection
  $("#stat").innerHTML=`<b>${items.length}</b> of ${DATA.facets.total}${nMiss?` <span style="color:var(--warn)">(${nMiss}◇)</span>`:''} · <b>${fmtSize(items.reduce((s,i)=>s+i.size,0))}</b>`;
  const grid=$("#grid");
  $("#colbtn").style.display=F.view==="list"?"":"none";
  if(F.view!=="list")$("#colmenu").classList.remove("on");
  grid.className=F.view==="list"?"listwrap":"grid";
  resetChunks();resetThumbs();
  grid.innerHTML="";
  if(!items.length){grid.innerHTML='<div class="empty">No matches. Loosen the filters.</div>';return;}
  if(F.view==="actress")renderByActress(items,grid);
  else if(F.view==="list")renderList(items,grid);
  else startChunks(grid,gridJobs(items,grid));
}
function renderList(items,grid){
  const cols=COLS.filter(c=>F.cols.includes(c.k));
  const th=cols.map(c=>`<th>${c.label}</th>`).join("");
  grid.innerHTML=`<table class="ltab"><thead><tr>${th}</tr></thead><tbody></tbody></table>`;
  const tb=grid.querySelector("tbody");
  // one delegated listener instead of one per row
  tb.onclick=e=>{
    if(e.target.closest(".stars"))return;   // let star clicks rate, not open
    const r=e.target.closest(".lrow");if(!r)return;
    const o=BYCODE.get(r.dataset.code);if(o)handleItemClick(o,e);};
  const rowHTML=it=>`<tr class="lrow${it.missing?' lmiss':''}" data-code="${esc(it.code)}">${
    cols.map(c=>`<td class="col-${c.k}">${c.html?c.html(it):esc(c.get(it))}</td>`).join("")}</tr>`;
  const jobs=[];
  for(let i=0;i<items.length;i+=CHUNK){
    const slice=items.slice(i,i+CHUNK);
    jobs.push(()=>{tb.insertAdjacentHTML("beforeend",slice.map(rowHTML).join(""));
                   if(F.cols.includes("rating"))bindStars(grid);return slice.length;});

}

function renderByActress(items,grid){
  const groups=new Map();
  items.forEach(it=>{
    const cast=(it.actresses&&it.actresses.length)?it.actresses.map(a=>a.disp).filter(Boolean)
              :[it.actress||"~ Unknown / amateur"];
    cast.forEach(k=>{if(!groups.has(k))groups.set(k,[]);groups.get(k).push(it);});});
  const ordered=[...groups.entries()].sort((a,b)=>{
    if(a[0].startsWith("~"))return 1;if(b[0].startsWith("~"))return -1;
    return b[1].length-a[1].length;});
  const aById=new Map();DATA.actresses.forEach(a=>{const k=a.disp||a.name_en;if(k)aById.set(k,a);});
  GROUPITEMS=new Map(ordered);
  const jobs=[];
  ordered.forEach(([name,arr])=>{
    jobs.push(()=>{grid.appendChild(actressHeader(name,arr,aById));return 0;});

        slice.forEach(it=>{const c=card(it);c.dataset.agroup=name;f.appendChild(c);});

/* -------- multi-select (shift/⌘-click) -> bulk assign actress -------- */
let SEL=new Set(), SELORDER=[], SELANCHOR=null;
function handleItemClick(it,e){

  if(e.shiftKey){e.preventDefault();selectRange(it.code);return;}
  if(e.metaKey||e.ctrlKey){e.preventDefault();toggleSel(it.code);return;}

}
function toggleSel(code){SEL.has(code)?SEL.delete(code):SEL.add(code);SELANCHOR=code;paintSel();}
function selectRange(code){
  const a=SELORDER.indexOf(SELANCHOR),b=SELORDER.indexOf(code);
  if(SELANCHOR&&a>=0&&b>=0){const[lo,hi]=a<b?[a,b]:[b,a];
    for(let i=lo;i<=hi;i++){const it=BYCODE.get(SELORDER[i]);if(it&&!it.missing)SEL.add(SELORDER[i]);}}
  else{SEL.add(code);}
  SELANCHOR=code;paintSel();
}
function clearSel(){SEL.clear();SELANCHOR=null;paintSel();}
function paintSel(){

          x.actress_id=j.actress_id;x.identified=!!j.actress;x.age=j.age;x.cup=j.cup;x.height=j.height;x.bust=j.bust;x.waist=j.waist;x.hip=j.hip;delete x._hay;}});

/* -------- lazy thumbnails + meta batching -------- */
/* The observer is built once and reused. render() calls resetThumbs() to drop stale
   targets; each appended chunk calls wireThumbs(), which observes only new thumbs
   (previously this re-observed every thumb in the grid on every single call). */
const THPEND=new Set();
let thTimer=null;
function flushMeta(){
  if(!THPEND.size)return;
  const codes=[...THPEND].slice(0,60);THPEND.clear();
  fetch("/api/meta?codes="+encodeURIComponent(codes.join(","))).then(r=>r.json()).then(m=>{
    Object.assign(META,m);
    codes.forEach(c=>applyMeta(c));
  }).catch(()=>{});
}
function resetThumbs(){if(io){io.disconnect();io=null;}}
function wireThumbs(){
  if(!io){
    io=new IntersectionObserver((es)=>{
      es.forEach(e=>{
        if(!e.isIntersecting)return;
        const t=e.target,code=t.dataset.code;
        io.unobserve(t);
        const img=new Image();
        img.onload=()=>{t.innerHTML="";
          img.style.width="100%";img.style.height="100%";img.style.objectFit="cover";
          t.appendChild(img);t.appendChild(badgeEl(code));t.appendChild(playEl());applyMeta(code);};
        img.onerror=()=>{t.querySelector(".ph")&&(t.querySelector(".ph").textContent="no preview");};
        img.src="/thumb/"+encodeURIComponent(code)+".jpg";
        if(META[code]===undefined){THPEND.add(code);clearTimeout(thTimer);thTimer=setTimeout(flushMeta,120);}
      });
    },{root:$("#main"),rootMargin:"400px"});
  }
  $$(".thumb:not([data-obs])").forEach(t=>{t.dataset.obs="1";io.observe(t);});
}
function badgeEl(code){const it=BYCODE.get(code);const d=document.createElement("div");d.className="badges";
  const parts=it&&it.nparts>1?`<span class="bdg parts">${it.nparts}×</span>`:"";
  const cens=it&&it.uncensored===false?'<span class="bdg cens">CENSORED</span>':"";
  d.innerHTML=`${cens}${parts}<span class="bdg hd" style="display:none"></span><span class="bdg dur" style="display:none"></span>`;return d;}
function playEl(){const d=document.createElement("div");d.className="play";d.innerHTML='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';return d;}
function applyMeta(code){
  const m=META[code];if(!m)return;
  $$(`.thumb[data-code="${cssEsc(code)}"]`).forEach(t=>{
    const dur=t.querySelector(".bdg.dur"),hd=t.querySelector(".bdg.hd");
    if(dur&&m.duration){dur.textContent=fmtDur(m.duration);dur.style.display="";}
    if(hd&&m.height){const b=resBucket(m.height);   // same buckets as the facet/filter
      if(b&&b!=="SD"){hd.textContent=b;hd.style.display="";}}
  });
}
const cssEsc=s=>s.replace(/["\\]/g,"\\$&");

/* ---------------- player modal (3-column) ---------------- */
function relatedTo(it){
  let rel;
  if(it.actress_id) rel=DATA.items.filter(o=>o.actress_id===it.actress_id);
  else if(it.actress) rel=DATA.items.filter(o=>o.actress&&o.actress===it.actress);
  else if(it.producer) rel=DATA.items.filter(o=>o.producer===it.producer);
  else rel=[it];
  // STABLE order — always by release date (newest first), independent of what's playing
  return rel.slice().sort((a,b)=>(b.release||"").localeCompare(a.release||"")||(b.mtime||0)-(a.mtime||0));
}
function partsHTML(it){        // part rows nested under the current row in the left list

       <div class="rd"><span>${fmtSize(pp.size)}</span></div></div></div>`).join("")+`</div>`;

/* On phones the player stacks vertically, so the two side panels become tabs under

  inp.onkeydown=e=>{
    if(e.key==="ArrowDown"){e.preventDefault();if(matches.length){hi=(hi+1)%matches.length;updHi();}}
    else if(e.key==="ArrowUp"){e.preventDefault();if(matches.length){hi=(hi-1+matches.length)%matches.length;updHi();}}
    else if(e.key==="Enter"){e.preventDefault();add(hi>=0&&matches[hi]?matches[hi]:inp.value);}
    else if(e.key==="Escape"){close();inp.value="";}
    else if(e.key===","){e.preventDefault();add(inp.value);}};
  sugg.onmousedown=e=>{const d=e.target.closest(".sg");if(d){e.preventDefault();add(matches[+d.dataset.i]);}};
  inp.onblur=()=>setTimeout(close,150);
}
function saveTags(it){
  fetch("/api/settags",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({code:it.code,tags:it.tags||[]})})
    .then(r=>r.json()).then(j=>{if(j.tags)it.tags=j.tags;delete it._hay;
      const ed=$("#tagEd");if(ed){ed.innerHTML=tagEdHTML(it);bindTagEditor(it);
        const inp=ed.querySelector(".tag-add");if(inp)inp.focus();}
      updateCardTags(it);}).catch(()=>toast("Tag save failed"));
}
function updateCardTags(it){
  $$(`.card[data-code="${cssEsc(it.code)}"]`).forEach(card=>{
    const meta=card.querySelector(".meta");if(!meta)return;
    let tr=meta.querySelector(".tags");
    const html=(it.tags||[]).slice(0,3).map(t=>`<span>${esc(t)}</span>`).join("");
    if(!tr&&html){tr=document.createElement("div");tr.className="tags";
      meta.querySelector(".c").after(tr);}
    if(tr)tr.innerHTML=html;
  });
}
// Move ONE movie to another actress (for a misgrouped/misfoldered title). Unlike the edit
// form — which renames the currently-linked actress — this relinks only this movie, via the
// same safe find-or-create path the multi-select bulk-assign uses (never renames anyone).
function reassignActress(it){
  const nb=document.querySelector("#player .p-side");if(!nb)return;
  const pl=$("#player");if(pl)pl.classList.add("editing");
  const cur=it.identified?esc(it.actress):"— unidentified —";
  nb.innerHTML=`
    <div class="edhead">Reassign actress <span>— moves this movie only; the catalog regroups, files aren't touched</span></div>
    <div class="racur">Currently: <b>${cur}</b> · <span class="code">${esc(it.code)}</span></div>
    <label class="edfl">Move to actress
      <input class="nedit-in" id="raIn" list="actressList" autocomplete="off" placeholder="type an existing name…"></label>
    <div class="raNew" id="raNew" hidden></div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn pri" id="raGo">Move</button>
      <button class="btn" id="raCancel">Cancel</button>
    </div>`;
  const input=$("#raIn"),hint=$("#raNew");
  input.focus();
  // tell the user whether the typed name links to an existing actress or would create a new one
  input.oninput=()=>{
    const v=input.value.trim();
    if(!v){hint.hidden=true;return;}
    const rec=ACTBYNAME[v.toLowerCase()];
    hint.hidden=false;
    hint.innerHTML=rec
      ? `<span class="raok">✓ Links to existing “${esc(rec.name_en||v)}”${rec.name_jp?" · "+esc(rec.name_jp):""}</span>`
      : `<span class="rawarn">⚠ No exact match — will create a new actress “${esc(v)}” (word-order / Japanese-name matches are still resolved on save)</span>`;
  };
  const cancel=()=>openPlayer(it);
  const go=()=>{
    const name=input.value.trim();
    if(!name){toast("Enter an actress name");return;}
    if(it.identified && name.toLowerCase()===(it.actress||"").toLowerCase()){cancel();return;}
    const btn=$("#raGo");btn.disabled=true;btn.textContent="Moving…";
    post2("/api/bulkactress",{codes:[it.code],name_en:name},j=>{
      if(j.error){toast(j.error);btn.disabled=false;btn.textContent="Move";return;}
      toast(`Moved ${it.code.replace(/^FC2-PPV-/,'PPV ')} → ${j.actress}`);
      // reload so both actresses' counts + grouping refresh, then reopen on the moved title
      reloadData(()=>{const fresh=BYCODE.get(it.code);if(fresh)openPlayer(fresh);});
    });
  };
  $("#raGo").onclick=go;
  $("#raCancel").onclick=cancel;
  input.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();go();}if(e.key==="Escape"){e.preventDefault();cancel();}};
}
function editActress(it){
  // render into the WHOLE side panel (not the narrow name block) and widen it, so the
  // fields use the full available width.
  const nb=document.querySelector("#player .p-side");if(!nb)return;
  const pl=$("#player");if(pl)pl.classList.add("editing");
  const v=x=>(x==null?"":x);
  const opt=(val,cur)=>`<option value="${val}"${String(cur)===String(val)?' selected':''}>${val}</option>`;
  const ageOpts=['<option value="">–</option>'].concat(
    Array.from({length:38},(_,i)=>opt(i+18,it.age))).join("");     // 18–55
  const cupOpts=['<option value="">–</option>'].concat(
    "ABCDEFGHIJK".split("").map(c=>opt(c,it.cup))).join("");
  const num=(id,val,mn,mx)=>`<input class="nedit-in sm" id="${id}" type="number" inputmode="numeric" min="${mn}" max="${mx}" step="1" value="${v(val)}">`;
  nb.innerHTML=`
    <div class="edhead">Edit <span>— saves to the movie / actress, never the filename</span></div>
    <label class="edfl">Movie title (English)
      <input class="nedit-in" id="edTitle" value="${esc(it.title_en||'')}"></label>
    <label class="edfl">Movie title (Japanese) 日本語
      <input class="nedit-in" id="edTitleJp" value="${esc(it.title||'')}"></label>
    <label class="edfl">Actress · English (romaji)
      <input class="nedit-in" id="edEn" list="actressList" autocomplete="off" placeholder="e.g. Hasumi Chise" value="${esc(it.actress_en||'')}"></label>
    <label class="edfl">Actress · Japanese 日本語
      <input class="nedit-in" id="edJp" placeholder="例：蓮実ちせ" value="${esc(it.actress_jp||'')}"></label>
    <div class="edrow">
      <label class="edfl2">Age<select class="nedit-in sm" id="edAge">${ageOpts}</select></label>
      <label class="edfl2">Cup<select class="nedit-in sm" id="edCup">${cupOpts}</select></label>
    </div>
    <div class="edrow">
      <label class="edfl2">Height (cm)${num("edH",it.height,100,220)}</label>
      <label class="edfl2">Bust (cm)${num("edB",it.bust,50,150)}</label>
    </div>
    <div class="edrow">
      <label class="edfl2">Waist (cm)${num("edW",it.waist,40,120)}</label>
      <label class="edfl2">Hip (cm)${num("edHip",it.hip,50,150)}</label>
    </div>
    <div style="display:flex;gap:8px;margin-top:4px">
      <button class="btn pri" id="edSave">Save</button>
      <button class="btn" id="edCancel">Cancel</button>
      <button class="btn" id="edEnrich" title="Scrape javdatabase + jav.guru for body info &amp; aliases. Only applied if one of her library codes appears in her filmography (verifies it's the right person).">🌐 Enrich from web</button>
    </div>
    <div class="code" style="margin-top:8px">${esc(it.code)}</div>`;
  $("#edEn").focus();
  $("#edCancel").onclick=()=>openPlayer(it);
  const save=()=>{
    const body={code:it.code,
      title_en:$("#edTitle").value.trim(), title:$("#edTitleJp").value.trim(),
      name_en:$("#edEn").value.trim(), name_jp:$("#edJp").value.trim(),
      age:$("#edAge").value.trim(), cup:$("#edCup").value.trim(),
      height:$("#edH").value.trim(), bust:$("#edB").value.trim(),
      waist:$("#edW").value.trim(), hip:$("#edHip").value.trim()};
    fetch("/api/setmeta",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
      .then(r=>r.json()).then(j=>{
        if(j.error){toast("Error: "+j.error);return;}
        applyMetaUpdate(it,j);toast("Saved");
        openPlayer(BYCODE.get(it.code)||it);render();
      }).catch(()=>toast("Save failed"));
  };
  $("#edSave").onclick=save;
  $("#edEnrich").onclick=(e)=>enrichFromWeb(it,e.currentTarget);
  // picking a KNOWN actress fills her stored body numbers into the form (so you see what
  // will be pulled) and marks the profile fields read-only — editing her switches away
  // from clobbering; you edit her profile from her own record.
  $("#edEn").onchange=e=>{
    const rec=ACTBYNAME[(e.target.value||"").trim().toLowerCase()];
    if(!rec)return;
    $("#edJp").value=rec.name_jp||"";
    $("#edAge").value=rec.age||"";$("#edCup").value=rec.cup||"";
    $("#edH").value=rec.height||"";$("#edB").value=rec.bust||"";
    $("#edW").value=rec.waist||"";$("#edHip").value=rec.hip||"";
  };
  // only the Save button persists; Enter no longer auto-saves (so Cancel/Esc truly discard)
  nb.querySelectorAll("input,select").forEach(el=>el.onkeydown=e=>{
    if(e.key==="Escape"){e.preventDefault();openPlayer(it);}});
}
function applyMetaUpdate(it,j){
  const c=j.item||{},aid=c.actress_id,set=new Set(j.affected||[]);
  const di=BYCODE.get(it.code);if(di){di.title_en=c.title_en;di.title=c.title;}
  DATA.items.forEach(x=>{if(set.has(x.code)){
    x.actress_id=aid;x.actress_en=c.name_en||"";x.actress_jp=c.name_jp||"";x.actress=c.actress;
    x.identified=!!c.actress;x.age=c.age;x.cup=c.cup;x.height=c.height;x.bust=c.bust;x.waist=c.waist;x.hip=c.hip;delete x._hay;}});
  if(aid){const rec=ACTBYID[aid]||{id:aid,count:0,missing_count:0,has_portrait:false};
    Object.assign(rec,{id:aid,name_en:c.name_en||null,name_jp:c.name_jp||null,age:c.age,cup:c.cup,
      height:c.height,bust:c.bust,waist:c.waist,hip:c.hip});
    ACTBYID[aid]=rec;if(!DATA.actresses.some(a=>a.id===aid))DATA.actresses.push(rec);
    if(c.name_en)ACTBYNAME[c.name_en.toLowerCase()]=rec;}
}
function enrichFromWeb(it,btn){
  const m=$("#enrichmodal"),b=$("#enrichbox");m.classList.add("on");
  b.innerHTML='<div class="orghd">Looking online…</div><div class="orgsub">Fetching profile from javdatabase & jav.guru.</div>';
  const close=()=>m.classList.remove("on");
  // 1) PREVIEW (dry — writes nothing)
  fetch("/api/enrichactress",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({code:it.code,dry:true})})
   .then(r=>r.json()).then(j=>{
     if(j.error){b.innerHTML=`<div class="orghd">Can't enrich yet</div><div class="orgsub">${esc(j.error)}</div><div class="pactions"><button class="btn" id="enClose">Close</button></div>`;$("#enClose").onclick=close;return;}
     const r=j.report||{},p=r.profile;
     if(!p){b.innerHTML=`<div class="orghd">Nothing found online</div><div class="orgsub">No javdatabase profile for <b>${esc(r.name||it.actress_en||"this actress")}</b> (tried: ${esc((r.tried||[]).join(", ")||"—")}). The site may not list this performer, or her name is spelled differently.</div><div class="pactions"><button class="btn" id="enClose">Close</button></div>`;$("#enClose").onclick=close;return;}
     const row=(k,v)=>v?`<div class="enr"><span class="enk">${k}</span><span class="env">${esc(String(v))}</span></div>`:"";
     const meas=(p.bust&&p.waist&&p.hip)?`B${p.bust} / W${p.waist} / H${p.hip}`:"";
     const grid=`<div class="engrid">
        ${row("Name (EN)",p.name_en)}${row("Name (JP)",p.name_jp)}
        ${row("Born",p.dob)}${row("Age",p.age)}
        ${row("Height",p.height&&p.height+" cm")}${row("Cup",p.cup)}
        ${row("Measurements",meas)}
      </div>`;
     const verified=r.verified===true;
     const banner=verified
        ? `<div class="enbanner ok">✓ Verified — matches your library code ${esc((r.matched_codes||[]).join(", "))}</div>`
        : `<div class="enbanner warn">⚠ Not verified — none of this actress's <b>${r.owned_codes||0}</b> owned code(s) appear in the <b>${r.javguru_codes||0}</b> works listed for her online. This could be a different person with the same name — check the profile matches before applying.</div>`;
     const src=[p.url?`<a href="${esc(p.url)}" target="_blank" rel="noopener">javdatabase</a>`:"",
                r.javguru_source?`<a href="${esc(r.javguru_source)}" target="_blank" rel="noopener">jav.guru</a>`:""].filter(Boolean).join(" · ");
     b.innerHTML=`
       <div class="orghd">Enrich · ${esc(r.name||it.actress_en||"")}</div>
       ${banner}
       ${grid}
       <div class="orgsub" style="margin-top:8px">Empty fields only are filled — your curated values are never overwritten. Sources: ${src||"—"}</div>
       <div class="pactions">
         <button class="btn ${verified?'pri':''}" id="enApply">${verified?'Apply':'Apply anyway (unverified)'}</button>
         <button class="btn" id="enCancel">Cancel</button>
       </div>`;
     $("#enCancel").onclick=close;
     $("#enApply").onclick=e=>{
       const ab=e.currentTarget;ab.textContent="Saving…";ab.disabled=true;
       // 2) APPLY (force only when unverified)
       fetch("/api/enrichactress",{method:"POST",headers:{"Content-Type":"application/json"},
         body:JSON.stringify({code:it.code,force:!verified})})
        .then(r=>r.json()).then(res=>{
          const rr=res.report||{};
          if(!rr.applied){toast(rr.note||res.error||"Nothing applied");ab.disabled=false;ab.textContent="Apply";return;}
          toast("✓ Saved "+[p.name_jp,p.age&&p.age+"y",p.cup&&p.cup+"-cup",p.height&&p.height+"cm",meas].filter(Boolean).join(" · ")+(rr.wishlist_added?` · +${rr.wishlist_added} wishlist`:''));
          close();
          // refresh data, then reopen the edit panel so the new values are visible immediately
          reloadData&&reloadData(()=>{const fresh=(DATA.items||[]).find(x=>x.code===it.code)||it;editActress(fresh);});
        }).catch(()=>{toast("Enrich failed");ab.disabled=false;ab.textContent="Apply";});
     };
   }).catch(()=>{b.innerHTML='<div class="orghd">Lookup failed</div><div class="orgsub">Could not reach the metadata sites.</div><div class="pactions"><button class="btn" id="enClose">Close</button></div>';const x=$("#enClose");if(x)x.onclick=close;});
}
function closePlayer(){const m=$("#modal");const v=m.querySelector("video");if(v){v.pause();v.src="";}m.classList.remove("on");}
function post(url,code,msg){fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code})})
  .then(r=>r.json()).then(j=>toast(j.ok?msg:("Error: "+(j.error||"?")))).catch(e=>toast("Error"));}

/* ---------------- UI wiring ---------------- */
function bindUI(){
  $("#q").oninput=e=>{F.q=e.target.value;render();};
  // filter drawer (small screens only; the button is display:none above 820px)
  const drawer=(on)=>{$("#side").classList.toggle("on",on);$("#scrim").classList.toggle("on",on);};
  $("#drawerBtn").onclick=()=>drawer(!$("#side").classList.contains("on"));
  $("#scrim").onclick=()=>drawer(false);
  // picking a filter on a phone should reveal the results, not stay in the sheet
  $("#side").addEventListener("click",e=>{
    if(window.matchMedia("(max-width:820px)").matches&&e.target.closest(".chip,.frow"))
      setTimeout(()=>drawer(false),160);});
  $("#sort").onchange=e=>{F.sort=e.target.value;render();};
  $("#shuffbtn").onclick=()=>{DATA.items.forEach(it=>it._rnd=Math.random());F.sort="shuffle";$("#sort").value="shuffle";render();};
  $("#resetbtn").onclick=resetFilters;
  $("#scanlibbtn").onclick=startLibraryScan;
  const setThemeIcon=()=>{const b=$("#themebtn");if(b)b.textContent=document.documentElement.dataset.theme==="light"?"☀️":"🌙";};
  setThemeIcon();
  $("#themebtn").onclick=()=>{const cur=document.documentElement.dataset.theme==="light"?"light":"dark";
    const next=cur==="light"?"dark":"light";document.documentElement.dataset.theme=next;
    try{localStorage.setItem("vault_theme",next);}catch(e){}setThemeIcon();};
  $("#importbtn").onclick=startImport;
  $("#impmodal").onclick=e=>{if(e.target.id==="impmodal"&&!IMPORT_RUNNING)$("#impmodal").classList.remove("on");};
  $("#setbtn").onclick=openSettings;
  $("#orgmodal").onclick=e=>{if(e.target.id==="orgmodal")$("#orgmodal").classList.remove("on");};
  pollScanProgress();  // reflect an already-running scan on load
  $$("#viewseg button").forEach(b=>b.onclick=()=>{
    F.view=b.dataset.v;$$("#viewseg button").forEach(x=>x.classList.toggle("on",x===b));render();});
  buildColMenu();
  $("#colbtn").onclick=e=>{e.stopPropagation();$("#colmenu").classList.toggle("on");};
  document.addEventListener("click",e=>{if(!e.target.closest("#colmenu")&&e.target.id!=="colbtn")$("#colmenu").classList.remove("on");});
  $("#modal").onclick=e=>{if(e.target.id==="modal")closePlayer();};
  $("#amodal").onclick=e=>{if(e.target.id==="amodal")$("#amodal").classList.remove("on");};
  document.addEventListener("keydown",e=>{
    if(e.key==="Escape"){closePlayer();$("#amodal").classList.remove("on");}
    const typing=/^(INPUT|SELECT|TEXTAREA)$/.test((e.target.tagName||""));
    if(e.key==="/"&&!typing){e.preventDefault();$("#q").focus();return;}
    if(typing)return;
    const v=$("#modal").classList.contains("on")?$("#modal").querySelector("video"):null;
    if(!v)return;
    const K=e.key.toLowerCase(),step=e.shiftKey?60:10;
    if(K===" "||K==="k"){e.preventDefault();v.paused?v.play():v.pause();}
    else if(e.key==="ArrowRight"||K==="l"){e.preventDefault();v.currentTime=Math.min(v.duration||1e9,v.currentTime+step);}
    else if(e.key==="ArrowLeft"||K==="j"){e.preventDefault();v.currentTime=Math.max(0,v.currentTime-step);}
    else if(e.key==="ArrowUp"){e.preventDefault();v.volume=Math.min(1,v.volume+0.1);}
    else if(e.key==="ArrowDown"){e.preventDefault();v.volume=Math.max(0,v.volume-0.1);}
    else if(K==="m"){v.muted=!v.muted;}
    else if(K==="f"){if(document.fullscreenElement)document.exitFullscreen();else v.requestFullscreen&&v.requestFullscreen();}
    else if(K>="0"&&K<="9"){if(v.duration)v.currentTime=v.duration*(+K)/10;}
    else if(e.key===">"||e.key===".")  {v.playbackRate=Math.min(4,+(v.playbackRate+0.25).toFixed(2));toast("Speed "+v.playbackRate+"×");}
    else if(e.key==="<"||e.key===",")  {v.playbackRate=Math.max(0.25,+(v.playbackRate-0.25).toFixed(2));toast("Speed "+v.playbackRate+"×");}
  });
}
boot();
